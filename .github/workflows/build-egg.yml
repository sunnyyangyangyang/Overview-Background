name: build-egg

on:
  push:
    branches: [new-ext]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install glib tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libglib2.0-dev

      - name: Compile schemas and package EGG
        run: |
          set -e
          uuid=$(python3 -c "import json; print(json.load(open('overview-background@github.com.sunnyyangyangyang/metadata.json'))['uuid'])")
          test "$uuid" = "overview-background@github.com.sunnyyangyangyang"
          glib-compile-schemas "$uuid/schemas"
          tar czf "$uuid.egg" "$uuid"
          tar tzf "$uuid.egg"

      - uses: actions/upload-artifact@v4
        with:
          name: extension-egg
          path: '*.egg'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.egg'
          generate_release_notes: true
