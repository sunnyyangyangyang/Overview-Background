name: build-and-publish

on:
  push:
    branches: [new-ext]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package zip
        run: |
          set -e
          cd overview-background@github.com.sunnyyangyangyang
          zip -qr ../pkg.zip .
          cd ..
          unzip -l pkg.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: pkg.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: extension-package

      - name: Upload to extensions.gnome.org
        env:
          EXT_USERNAME: ${{ secrets.EXT_USERNAME }}
          EXT_PASSWORD: ${{ secrets.EXT_PASSWORD }}
        run: python3 scripts/upload.py pkg.zip
